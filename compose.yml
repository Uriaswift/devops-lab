services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: devops-lab-backend

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/actuator/health
      interval: 10s  
      timeout: 3s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: devops-lab-frontend

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped
