services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: devops-lab-backend

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: devops-lab-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped
