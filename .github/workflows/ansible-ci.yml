---
name: Ansible CI

on:
  pull_request:
    paths:
      - "infrastructure/ansible/**"
      - ".github/workflows/ansible-ci.yml"

  push:
    branches:
      - main
    paths:
      - "infrastructure/ansible/**"
      - ".github/workflows/ansible-ci.yml"

jobs:
  ansible-test:
    name: Lint and Molecule
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/ansible/requirements-ci.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infrastructure/ansible/requirements-ci.txt

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install \
            -r infrastructure/ansible/requirements-ci.yml

      - name: Show tool versions
        run: |
          python --version
          ansible --version
          ansible-lint --version
          molecule --version
          docker --version

      - name: Run ansible-lint
        working-directory: infrastructure/ansible
        run: ansible-lint

      - name: Run Molecule tests
        working-directory: infrastructure/ansible/roles/nginx
        run: molecule test