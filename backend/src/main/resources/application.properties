spring.application.name=devops-lab-backend

server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devopslab}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devopslab}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devopslab}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

devopslab.runner.ansible.enabled=false
devopslab.runner.ansible.work-directory=/opt/devops-lab/infrastructure/ansible
