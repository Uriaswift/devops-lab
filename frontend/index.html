<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Lab</title>
</head>
<body>
    <h1>DevOps Lab</h1>

    <p id="status">Checking backend...</p>

    <script>
        fetch('/api/health')
            .then(response => response.json())
            .then(data => {
                document.getElementById('status').textContent =
                    `Backend status: ${data.status}, service: ${data.service}`;
            })
            .catch(error => {
                document.getElementById('status').textContent =
                    'Backend unavailable';

                console.error(error);
            });
    </script>
</body>
</html>
