---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Check nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Check nginx service
      ansible.builtin.systemd:
        name: nginx
      register: nginx_status

    - name: Verify nginx is active
      ansible.builtin.assert:
        that:
          - nginx_status.status.ActiveState == "active"

    - name: Request homepage
      ansible.builtin.uri:
        url: http://127.0.0.1
        return_content: true
        status_code: 200
      register: nginx_homepage

    - name: Verify homepage content
      ansible.builtin.assert:
        that:
          - "'DevOps Lab' in nginx_homepage.content"
